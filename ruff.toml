# Repo-root config: scripts/ sits outside python/, so a config inside
# python/pyproject.toml would not cover it.

# 88 rather than PEP 8's 79. Measured over python/ and scripts/: 88
# reformats 3621 lines against 4817 at 79, and the code already sits at a
# 75-character 95th percentile.
line-length = 88
target-version = "py310"
extend-exclude = ["build", ".venv"]

[lint]
# Deliberately conservative. E and F are the pycodestyle/pyflakes core, B
# catches bug-prone patterns, C4 the comprehension rewrites. Not selected:
# I (import sorting) would reorder imports across every driver for no
# behavioural gain, and UP would rewrite typing constructs that must keep
# working on the >=3.10 floor this project declares.
select = ["E", "F", "B", "C4"]
# Line length belongs to the formatter, not the linter.
ignore = ["E501"]
