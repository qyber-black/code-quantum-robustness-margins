# MISS_HIT configuration for the MATLAB/Octave peers.
#
# mh_lint (semantic) and mh_metric (complexity) run at their defaults and are
# clean. mh_style needs this file: several of its defaults encode conventions
# this project deliberately does not follow, and a rule that fires on correct
# code teaches people to ignore the tool.
#
# Raised rather than default 80: the peers mirror the Python reference, whose
# formatter is set to 88, and the long lines here are mostly help text.
line_length: 132

# The defaults reject the domain notation the mathematics requires -- Hhat,
# dH, FT, H_list, G_gamma -- and the names are the paper's, not arbitrary.
regex_function_name: "[a-zA-Z][A-Za-z0-9_]*"
regex_parameter_name: "[a-zA-Z][A-Za-z0-9_]*"

# MATLAB's own help convention: the H1 line and help block start at column 0
# immediately after "function", and read "%FUNCNAME summary" with no space.
# miss_hit wants both indented and spaced; following it would break the
# convention "help" and every MathWorks example use.
suppress_rule: "indentation"
suppress_rule: "whitespace_comments"

# Licensing is enforced by REUSE (reuse lint, gated in CI, 301/301). This
# project puts SPDX headers at the foot of .m files, where miss_hit does not
# look, so its own copyright check only produces false positives here.
suppress_rule: "copyright_notice"

# The compact single-line guard "if cond; x = y; end" is used throughout,
# including in argument defaulting. It is a deliberate house idiom.
suppress_rule: "end_of_statements"

# Nested helpers use the same notation as the functions around them.
regex_nested_name: "[a-zA-Z][A-Za-z0-9_]*"

# Multi-line formulae lead their continuations with the operator:
#     v = a ...
#         + b ...
#         + c;
# which keeps the algebra readable down the left margin and matches how the
# expressions are written in the paper. miss_hit prefers a trailing operator.
suppress_rule: "operator_after_continuation"
